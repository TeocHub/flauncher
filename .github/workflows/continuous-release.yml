name: Teoc Launcher build

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build APK
    env:
      OUTPUT_DIR: 'build/app/outputs/flutter-apk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Build
        run: |
          flutter --no-color build apk --release --build-number ${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          cd $OUTPUT_DIR
          for f in app-*-release.apk; do mv "$f" "teoc-launcher-${f#app-}"; done
          mv app-release.apk teoc-launcher-universal-release.apk
          ls -la
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: teoc-launcher
          path: ${{ env.OUTPUT_DIR }}/teoc-launcher-*.apk
          retention-days: 30
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "teoc-${{ github.run_number }}" --latest \
            --title "Teoc Launcher #${{ github.run_number }}" \
            --notes "Para la tele Sharp (32 bits) descarga el APK que dice armeabi-v7a." \
            ${{ env.OUTPUT_DIR }}/teoc-launcher-*.apk
